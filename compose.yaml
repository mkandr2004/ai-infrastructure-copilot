name: ai-infrastructure-copilot

x-app-environment: &app-environment
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
  GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-30000}
  GEMINI_RETRY_ATTEMPTS: ${GEMINI_RETRY_ATTEMPTS:-1}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-ai_infrastructure_copilot}
  POSTGRES_USER: ${POSTGRES_USER:-ai_copilot_app}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
  QDRANT_PATH: /app/data/qdrant
  QDRANT_COLLECTION: ${QDRANT_COLLECTION:-infrastructure_knowledge}
  KNOWLEDGE_PATH: /app/knowledge
  RAG_SCORE_THRESHOLD: ${RAG_SCORE_THRESHOLD:-0.72}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DB: ${REDIS_DB:-0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ai_copilot}
  INCIDENT_TTL_SECONDS: ${INCIDENT_TTL_SECONDS:-604800}
  WORKFLOW_TTL_SECONDS: ${WORKFLOW_TTL_SECONDS:-86400}
  WORKFLOW_QUEUE_NAME: ${WORKFLOW_QUEUE_NAME:-investigation-workflows}
  WORKFLOW_WORKER_POLL_SECONDS: ${WORKFLOW_WORKER_POLL_SECONDS:-2}
  ALERT_TTL_SECONDS: ${ALERT_TTL_SECONDS:-604800}
  ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?ALERT_WEBHOOK_TOKEN doit être défini dans .env}
  NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
  NOTIFICATION_TIMEOUT_SECONDS: ${NOTIFICATION_TIMEOUT_SECONDS:-5}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_infrastructure_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-ai_copilot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-infrastructure-copilot:local
    environment:
      <<: *app-environment
      INITIALIZE_DATABASE: "true"
      DATABASE_INIT_MAX_ATTEMPTS: 30
      DATABASE_INIT_RETRY_SECONDS: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - qdrant_data:/app/data/qdrant
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    read_only: true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  monitoring:
    image: ai-infrastructure-copilot:local
    environment:
      <<: *app-environment
      INITIALIZE_DATABASE: "false"
    command:
      - python
      - -m
      - app.monitoring
      - --interval
      - ${MONITORING_INTERVAL_SECONDS:-60}
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    read_only: true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  workflow-worker:
    image: ai-infrastructure-copilot:local
    environment:
      <<: *app-environment
      INITIALIZE_DATABASE: "false"
    command:
      - python
      - -m
      - app.workflows.worker
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - qdrant_data:/app/data/qdrant
    healthcheck:
      disable: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    read_only: true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    depends_on:
      app:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test:
        - CMD
        - promtool
        - check
        - ready
        - --url=http://127.0.0.1:9090
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    environment:
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?ALERT_WEBHOOK_TOKEN doit être défini dans .env}
    entrypoint:
      - /bin/sh
      - /etc/alertmanager/render-config.sh
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./docker/render-alertmanager-config.sh:/etc/alertmanager/render-config.sh:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test:
        - CMD
        - amtool
        - check-config
        - /tmp/alertmanager.yml
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.3.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD doit être défini dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
